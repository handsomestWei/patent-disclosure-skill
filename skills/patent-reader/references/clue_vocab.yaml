# 摘要清洗：16 字以内、无标点的菜单式短行，命中下列整词或结尾即丢弃
menu_words:
  - 基膜
  - 涂覆
menu_suffixes:
  - 隔膜

# 线索 ↔ 权项 / 特征弱匹配时不计入共现的泛词
token_stopwords:
  - 一种
  - 方法
  - 包括
  - 所述
  - 以及
  - 进行
  - 公开
  - 专利
  - 公司
  - 技术
  - 产品
  - 相关
  - 是否
  - 需要
  - 本申请
  - 本专利
  - 置信度
  - 来源
  - 理由

# 特征名拆成二字词比对时跳过的泛词
feature_label_stopwords:
  - 对比
  - 相关
  - 性能
  - 具体
  - 实施
  - 方式
  - 问题
  - 参数
  - 叙述
  - 占位
  - 附图

