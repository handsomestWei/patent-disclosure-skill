# 公开检索线索（附录 B / clues/ / 各节旁注）的词表与阈值。
# 由 tools/vault/clues/vocab.py 读取；改词表只动本文件，不必改代码。

# 线索默认最多保留条数（validate_public_clues.py / 入库筛选）
max_clues: 3

# 置信度 → 排序权重（高者优先）
confidence_rank:
  高: 3
  high: 3
  中: 2
  medium: 2
  med: 2
  mid: 2
  低: 1
  low: 1

# 线索 region_group → 附录与线索笔记里显示的中文名
region_group_labels:
  market: 本国市场
  applicant_home: 申请人所在国
  other: 其他地区

