# 专利全文 PDF 取证源（本包 fetch_patent_pdf.py 使用）
# 下载途径二选一：① computer-use MCP 桌面控制（真人浏览器，可下国知局单行本，见下方 computer_use_mcp，优先）；② 技能脚本走 Google Patents（下方 sources）。
# 国知局 epub 仅核验著录；全文下载优先 MCP（Google Patents 连不上/遇 WAF/验证码亦走 MCP），MCP 失败/常规件才转脚本。priority 越小越优先。

sources:
  - id: computer_use_mcp
    priority: 5
    role: primary_download
    status: proven
    name: computer-use MCP 桌面控制（真人浏览器）
    notes: |
      默认主途径（Google Patents 连不上 / 遇瑞数 WAF / 验证码、或需下国知局单行本全文时亦用）。
      前置：用户须先自行登录其国知局账户（单行本下载需登录态；技能不代登录、不接触/不保存
      凭据），登录态保留在用户浏览器会话。
      用 windows-computer-use MCP 操作本机 Chrome/Edge：导航 epub.cnipa.gov.cn/patent/{pub}
      （或 Google Patents 详情页），点击「单行本」/下载链接，过人机验证后保存 PDF 到
      outputs/patent_reader/${RUN}/source/{pub}.pdf。真人浏览器可过 WAF/验证码，不受服务端接口
      不稳定限制。之后仍走 extract_patent_text.py。
      逐篇操作序列 + 踩坑（输入法乱码/检索框残留/公开号点击/文献浏览不刷新/下载图标位置/
      等待与点击频次/出错查验与求助）：见 references/gui_download_cnipa.md（实测 21 篇成功；
      全部走 windows-computer-use MCP，原 pi-computer-use ref 工具已卸载）。
      合规：全文 PDF 为法定公开信息，真人浏览器 GUI 下载属正常人工访问（过验证码为真人
      输入、非绕过技术措施）；保持人工节奏、控制单次数量，勿自动化批量；仅限个人研究与
      内部流程，勿再分发/转售/商业建库，商业用途走官方/授权渠道；不绕过登录/付费访问控制。

  - id: google_patents_page
    priority: 10
    role: secondary
    status: proven
    name: Google Patents 详情页
    page_templates:
      - "https://patents.google.com/patent/{pub}/zh"
      - "https://patents.google.com/patent/{pub}/en"
      - "https://patents.google.com/patent/{pub}"
    notes: |
      三页并行，读到 citation_pdf_url（页首约 2KB）即断开，再解析 pdfLink / CDN 兜底。
      直链 https://patents.google.com/patent/{pub}.pdf 常 404，勿当作主路径。
      详情页 404 = 未收录（新公开专利通常 1–3 周后才上 Google）；外观设计多有页无 PDF。
      实测正常 2.5–3 秒完成；连不上时约 5 秒失败，总时限默认 45 秒。

  - id: google_patentimages_cdn
    priority: 20
    role: download
    status: proven
    name: Google Patents PDF CDN
    host: patentimages.storage.googleapis.com
    url_pattern: "https://patentimages.storage.googleapis.com/<hash-path>/{pub}.pdf"
    notes: |
      实战多次成功（含示例 CN119961390A / CN119961396A / CN114552122A）。
      hash 路径须从详情页解析，不可臆造。

  - id: cnipa_epub_meta
    priority: 40
    role: verify_meta
    status: proven
    name: 公布站著录核验（不下全文）
    tool: skills/patent-reader/tools/crawl/cnipa_epub_crawler.py
    notes: |
      只核验公开号、标题、摘要、申请人；不提供全文 PDF（见 unstable_or_skip.cnipa_epub_fulltext）。

  - id: user_local_pdf
    priority: 10
    role: override
    status: proven
    name: 用户本地 PDF / 已下载文件
    notes: 若用户已提供路径，跳过联网下载，直接 extract。

# 非默认 / 不稳定（记录以免重复踩坑；脚本默认不依赖）
unstable_or_skip:
  - id: patentguru
    status: unreliable
    notes: 部分公开号 404，不作默认备选。
  - id: google_patent_dot_pdf
    status: often_404
    notes: patents.google.com/patent/{pub}.pdf 常失败。
  - id: commercial_dbs
    status: account_required
    notes: 需账号的付费专利库不写入默认技能链路。
  - id: cnipa_epub_fulltext
    status: server_unreliable
    notes: |
      2026-09 实测放弃（脚本）。详情页单行本按钮 POST /Sw/SwDetail，服务端约 10 秒后回 400
      （无头 / 有界面、GET / POST 皆然，偶发成功）；成功页里 egaz /filedl 下载需算术验证码，
      验证通过后仍 400 / 502。/showPage 只给逐页 PNG（无文字层），/imgs/.../TEMPSWF 仅预生成前 3 页。
      另有瑞数 WAF，须真浏览器，单次 20 秒以上。
      脚本不再尝试；如确需国知局单行本全文，改走 computer_use_mcp 真人浏览器桌面控制。
  - id: drugfuture_cnpat
    status: captcha
    notes: drugfuture.com 中国专利下载须图片验证码，底层仍是国知局数据。
  - id: espacenet_web
    status: blocked
    notes: worldwide.espacenet.com 对脚本请求回 403；OPS API 需注册密钥。

# 示例专利已知 CDN（仅 examples；通用下载仍应解析页面）
known_cdn_examples:
  CN119961390A: "https://patentimages.storage.googleapis.com/58/1b/9b/07a9f35635df34/CN119961390A.pdf"
  CN119961396A: "https://patentimages.storage.googleapis.com/3f/29/d0/a2461c5080d73d/CN119961396A.pdf"
  CN114552122A: "https://patentimages.storage.googleapis.com/c2/6c/51/75412585086edf/CN114552122A.pdf"
  CN209861402U: "https://patentimages.storage.googleapis.com/39/b7/d6/0050a57f67b004/CN209861402U.pdf"
  # 外观示例 CN309939145S：通常无 PDF CDN。视图请用
  # skills/patent-reader/tools/extract/fetch_design_views.py（国知局会话 + /patent/{pub} + /imgs 序号探测）

# 外观设计视图（非 PDF）
design_views:
  - id: cnipa_epub_session_detail
    priority: 10
    role: primary
    status: proven
    name: 国知局公布站检索会话 → 专利详情页视图
    tool: skills/patent-reader/tools/extract/fetch_design_views.py
    notes: |
      Google Patents 对中国外观设计常无 PDF/附图 CDN。
      直连 epub.cnipa.gov.cn/patent/{pub} 易被 WAF 返回空页。
      须先 Playwright 过首页检索（本包 crawl/cnipa_epub_crawler.py），再同会话打开详情，
      从 /imgs/.../NNNNNN.jpg 目录序号探测下载全图。
